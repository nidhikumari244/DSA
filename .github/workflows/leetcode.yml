name: Sync LeetCode Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record HEAD before sync
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync LeetCode Submissions
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          filter-duplicate-secs: 86400
          destination-folder: 'LeetCode'
          verbose: true
          commit-header: '[LeetCode Sync]'

      - name: Split README and solution into separate commits
        env:
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "Nidhi Kumari"
          git config user.email "nidhigupta2462@gmail.com"
          : "${BEFORE:?}"
          HEADER='[LeetCode Sync]'
          LOG='LeetCode/CONTRIBUTION_LOG.md'

          git fetch -q origin main
          AFTER=$(git rev-parse origin/main)
          [ "$BEFORE" = "$AFTER" ] && { echo "No new commits. Nothing to do."; exit 0; }
          git merge-base --is-ancestor "$BEFORE" "$AFTER" || { echo "History diverged. Aborting without changes."; exit 0; }

          # Only touch commits made by the sync action
          for sha in $(git rev-list --first-parent "$BEFORE..$AFTER"); do
            case "$(git log -1 --format=%s "$sha")" in
              "$HEADER"*) ;;
              *) echo "Found a non-sync commit ($sha). Aborting without changes."; exit 0 ;;
            esac
          done

          git checkout -q --detach "$BEFORE"
          CHANGED=0
          mk() { # mk <msgfile> <sha> ; commits staged changes with the original identity and dates
            GIT_AUTHOR_NAME="$(git log -1 --format=%an "$2")" GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae "$2")" \
            GIT_COMMITTER_NAME="$(git log -1 --format=%cn "$2")" GIT_COMMITTER_EMAIL="$(git log -1 --format=%ce "$2")" \
            GIT_AUTHOR_DATE="$(git log -1 --format=%aI "$2")" GIT_COMMITTER_DATE="$(git log -1 --format=%cI "$2")" \
            git commit -q -F "$1"
          }

          for sha in $(git rev-list --reverse --first-parent "$BEFORE..$AFTER"); do
            git log -1 --format=%B "$sha" > /tmp/orig_msg
            files=$(git diff-tree --no-commit-id --name-only -r "$sha")
            if [ -z "$files" ]; then
              mkdir -p "$(dirname "$LOG")"
              echo "- $(git log -1 --format=%aI "$sha") - $(git log -1 --format=%s "$sha") (resubmission, no file change)" >> "$LOG"
              git add "$LOG"; mk /tmp/orig_msg "$sha"; CHANGED=1; continue
            fi
            readme=$(echo "$files" | grep -E '(^|/)README\.md$' || true)
            others=$(echo "$files" | grep -vE '(^|/)README\.md$' || true)
            if [ -n "$readme" ] && [ -n "$others" ]; then
              echo "$HEADER Create README - $(dirname "$(echo "$readme" | head -1)" | xargs basename)" > /tmp/readme_msg
              echo "$readme" | while read -r f; do git checkout "$sha" -- "$f"; done
              mk /tmp/readme_msg "$sha"
              echo "$others" | while read -r f; do git checkout "$sha" -- "$f"; done
              mk /tmp/orig_msg "$sha"; CHANGED=1
            else
              echo "$files" | while read -r f; do git checkout "$sha" -- "$f"; done
              mk /tmp/orig_msg "$sha"
            fi
          done

          # Safety check: apart from the log file, the final content must be identical to what the action pushed
          if [ -n "$(git diff --name-only "$AFTER" HEAD -- . ":(exclude)$LOG")" ]; then
            echo "Content mismatch. Aborting without pushing."; exit 1
          fi
          if [ "$CHANGED" -eq 0 ]; then echo "Nothing needed rewriting."; exit 0; fi
          git push --force-with-lease=main:"$AFTER" origin HEAD:main
          echo "Rewrote sync commits: $BEFORE..$AFTER"
